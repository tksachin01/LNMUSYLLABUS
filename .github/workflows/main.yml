name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build Web App
        run: npm run build

      - name: Initialize & Add Android
        run: |
          npx @capacitor/cli init LNMUBUDDY com.tksachin.lnmubuddy --web-dir dist || true
          npx @capacitor/cli add android || true

      - name: Generate Custom App Icons
        run: |
          mkdir -p assets
          
          if [ -f "src/logo.png" ]; then
            cp src/logo.png assets/icon-only.png
            cp src/logo.png assets/icon-foreground.png
            cp src/logo.png assets/icon-background.png
          elif [ -f "src/Logo.png" ]; then
            cp src/Logo.png assets/icon-only.png
            cp src/Logo.png assets/icon-foreground.png
            cp src/Logo.png assets/icon-background.png
          else
            echo "Error: Logo file not found!"
            exit 1
          fi

          echo '{"backgroundColor": "#ffffff", "theme": "light"}' > assets/icon-background.json
          npx @capacitor/assets generate --android

      - name: Sync Capacitor Changes
        run: npx @capacitor/cli sync android

      - name: Fix Duplicate Kotlin Classes (All Projects)
        run: |
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          if (details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

          
