<!doctype html>
<html lang="en" class="dark app-dark-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LNMU Syllabus Buddy</title>
    <meta name="description" content="An academic syllabus explorer for Lalit Narayan Mithila University (LNMU) with dynamic 'Share to AI' prompts for detailed learning." />
    <meta property="og:title" content="LNMU Syllabus Buddy" />
    <meta property="og:description" content="An academic syllabus explorer for Lalit Narayan Mithila University (LNMU) with dynamic 'Share to AI' prompts for detailed learning." />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('lnmu-theme-mode');
          if (mode === 'light') {
            document.documentElement.classList.remove('dark', 'app-dark-mode');
          } else {
            document.documentElement.classList.add('dark', 'app-dark-mode');
          }
        } catch (e) {
          document.documentElement.classList.add('dark', 'app-dark-mode');
        }
      })();
    </script>
  </head>
  <body class="bg-[#070d17] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
